name: Sync package lock

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-package-lock.yml

permissions:
  contents: write

concurrency:
  group: sync-package-lock
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate lockfile using npm
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Check installation consistency without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile only
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'Lockfile already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package-lock.json
          git commit -m 'chore: sync package-lock.json for sharp'
          git push origin HEAD:main
